name: release

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go 1.25
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: false

    - name: Lint
      uses: golangci/golangci-lint-action@v9

    - name: Build project
      run: make
