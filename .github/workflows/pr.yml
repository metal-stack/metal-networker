name: pr

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go 1.26
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'
        cache: false

    - name: Lint
      uses: golangci/golangci-lint-action@v9

    - name: Build project
      run: make
